# Bench wiring for frank-amiga. Instruments are addressed by USB serial
# number, never by /dev node: tty names move on replug.
#
# MASTER = RP2350B (U3): SWD J1, UART0 J2, HDMI, SD, I2S, USB host.
# SLAVE  = RP2350A (U6): SWD J3, UART1 J4.

MASTER_PROBE=E6616407E335BB29      # official RPi Debug Probe
SLAVE_PROBE=E6635C08CB46BB26       # Pico running debugprobe
# 1 MHz on the master: once HSTX drives HDMI, faster SWD corrupts writes.
MASTER_SWD_KHZ=1000
SLAVE_SWD_KHZ=4000

# picotool selects a BOOTSEL device by its USB serial, which is the chip ID.
MASTER_CHIP_ID=CA6828FE74C242BD
SLAVE_CHIP_ID=0EABFE97D5DFEA9F

CAPTURE_VIDEO="USB Video"
CAPTURE_AUDIO="USB Audio Device"
